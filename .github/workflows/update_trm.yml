name: Update TRM Data

on:
  schedule:
    - cron: '0 1 * * *' # Once a day at 8:00 PM COT (01:00 UTC)
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main
    paths-ignore:
      - 'trm.json'
      - 'rates.json'
      - 'rates/**'
      - 'README.md'

jobs:
  update-trm:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # No setup-python step: the script uses only the standard library,
      # so the runner's preinstalled python3 is enough. Pinning an old
      # version (3.9) broke the job when ubuntu-latest moved to 26.04.
      - name: Show Python version
        run: python3 --version

      - name: Run offline tests
        run: python3 -m unittest test_rates

      - name: Fetch TRM and other rates, update JSON
        run: python3 main.py trm.json rates.json

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add trm.json rates.json rates/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update TRM data [skip ci]" && git push)
